[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "uv", "build", "wheel"]

[project]
classifiers = [
  "Typing :: Typed",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = ["pydantic>=2.10.6", "pydantic-settings>=2.8.0"]
description = "Build robust python applications"
license = {file = "LICENSE"}
name = "affect"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = [
  "build>=1.2.2.post1",
  "mypy>=1.15.0",
  "pre-commit>=4.1.0",
  "ruff>=0.9.7",
  "tbump>=6.11.0",
  "ty"
]
docs = [
  "zensical"
]
test = [
  "pytest",
  "pytest-asyncio"
]

[project.urls]
Documentation = "https://matthewmckee4.github.io/affect/"
Homepage = "https://matthewmckee4.github.io/affect/"
Issues = "https://github.com/MatthewMckee4/affect/issues"
Repository = "https://github.com/MatthewMckee4/affect"

[tool.coverage.report]
exclude_also = [
  "if self\\.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "if TYPE_CHECKING:",
  "@overload"
]
ignore_errors = true

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
fix = true
target-version = "py311"
exclude = ["tests"]

[tool.ruff.lint]
per-file-ignores = {"tests/*.py" = ["D", "S101"]}
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
where = ["src"]

[tool.tbump]

[[tool.tbump.file]]
src = "README.md"

[[tool.tbump.file]]
src = "pyproject.toml"

[[tool.tbump.file]]
src = "src/affect/version.py"

[tool.tbump.git]
message_template = "Bump to v{new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "0.1.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''
