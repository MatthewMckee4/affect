name: Release

on:
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*

permissions: {}

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: 3.13
          enable-cache: false
      - name: Install Dependencies
        run: uv sync --all-extras
      - name: Build package
        run: make build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.12

  release_github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: 3.13
          enable-cache: false
      - name: Install Dependencies
        run: uv sync --all-extras
      - name: Publish Latest Draft
        run: |
          if gh release list | grep Draft; then
              old_version="$(gh release list | grep Draft | head -1 | cut -f1)"
              new_version="${GITHUB_REF_NAME}"
              body=$(gh release view "$old_version" --json body -q ".body" | sed "s/\.\.\.$old_version/...$new_version/g")
              gh release delete "$old_version"
              gh release create "$new_version" --title "${GITHUB_REF_NAME}" --notes "$body";
            else
              gh release create "$new_version" --title "${GITHUB_REF_NAME}";
            fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: 3.13
          enable-cache: false
      - name: Install Dependencies
        run: uv sync --all-extras
      - name: Build docs
        run: make docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site/

  deploy-docs:
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
